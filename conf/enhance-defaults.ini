# ---------------------------------------------------------------------------
# LDBC SNB Datagen - skew-enhancement parameter file (all features OFF)
#
# Usage:
#   spark-submit ... --enhance-param-file conf/enhance-defaults.ini
#   spark-submit ... --enhance-params enhance.enabled=true,enhance.remap.enabled=true
#
# Precedence: --enhance-params (CLI) > --enhance-param-file > defaults
# With every knob disabled the generator output is identical to native Datagen.
# ---------------------------------------------------------------------------

# master switch: when false, all enhancement modules are skipped entirely
enhance.enabled              = false

# --- F2: partition skew (deterministic bijective id remap) ------------------
# every N-th person id is "hot"; hot entities are remapped into [0, numPersons/N)
# so hash/id-range partitioning yields one hot partition
enhance.remap.enabled        = false
enhance.remap.hotEvery       = 20

# --- F3: topology skew ------------------------------------------------------
# supernode persons: rate of persons turned into supernodes (0.0001 = 1:10000)
enhance.supernode.enabled            = false
enhance.supernode.rate               = 0.0001
enhance.supernode.minExtra           = 100
enhance.supernode.maxExtraDegreeMul  = 10000
# hot messages: mass likes / replies / tags on messages created by supernodes
enhance.hotmsg.enabled       = false
enhance.hotmsg.likes         = 1000
enhance.hotmsg.replies       = 50
enhance.hotmsg.tags          = 8
# small isolated components injected on a reserved id band (0 = auto:
# (255<<36) + numPersons; band must not collide with native ids)
enhance.smallcomp.enabled    = false
enhance.smallcomp.count      = 1000
enhance.smallcomp.cliqueMax  = 5
enhance.smallcomp.reserveBase = 0
# randomly drop a fraction of native knows edges (community fragmentation)
enhance.fragment.dropKnowsRatio = 0.0
# duplicate a fraction of knows edges flipped (unidirectional asymmetric edges)
enhance.unidir.flipRatio     = 0.0
# R-MAT power-law subgraph on reserved nodes (Graph500 style)
enhance.rmat.enabled         = false
enhance.rmat.nodes           = 100000
enhance.rmat.edgesPerNode    = 8.0
enhance.rmat.a               = 0.57
enhance.rmat.b               = 0.19
enhance.rmat.c               = 0.19

# --- F4: zipf attribute skew ------------------------------------------------
# attributes: comma list of locationIP, browserUsed, tag
enhance.zipf.enabled         = false
enhance.zipf.s               = 1.1
enhance.zipf.attrs           = locationIP,browserUsed,tag
enhance.zipf.buckets         = 1000000

# --- F5: temporal burst -----------------------------------------------------
# compress a fraction of recent activities into short burst windows
enhance.burst.enabled        = false
enhance.burst.recentDays     = 30
enhance.burst.ratio          = 0.2
enhance.burst.windowMillis   = 3600000
enhance.burst.windowCount    = 24
# concentrate likes on supernode messages into a tiny time window
enhance.supernodeLikeBurst.enabled = false
# hot/cold data split: hotRatio fraction of activity into the recent window
enhance.hotcold.split        = false
enhance.hotcold.hotRatio     = 0.95

# --- F6: dirty data ---------------------------------------------------------
enhance.dirty.nullContentRatio      = 0.0
enhance.dirty.emptyContentRatio     = 0.0
enhance.dirty.selfLoopRatio         = 0.0
enhance.dirty.dupEdgeRatio          = 0.0
enhance.dirty.danglingLikeRatio     = 0.0
enhance.dirty.invalidIpRatio        = 0.0
enhance.dirty.outOfRangeDateRatio   = 0.0

# deterministic hash seed (change to produce a different enhanced variant)
enhance.salt                 = 24301
