# Skew-enhancement parameters for SF1000 (~1TB raw CSV) full-feature generation.
# Tuned for SF1000 scale: hot band M = ceil(numPersons/20) ~= 230k persons,
# supernode.rate 0.0001 => ~23 supernodes => ~2.6k hot posts.
[enhance]
enhance.enabled = true
# F2: partition skew
enhance.remap.enabled = true
enhance.remap.hotEvery = 20
# F3: topology skew
enhance.supernode.enabled = true
enhance.supernode.rate = 0.0001
enhance.supernode.minExtra = 100
enhance.supernode.maxExtraDegreeMul = 10000
enhance.hotmsg.enabled = true
enhance.hotmsg.likes = 1000
enhance.hotmsg.replies = 50
enhance.hotmsg.tags = 8
enhance.smallcomp.enabled = true
enhance.smallcomp.count = 1000
enhance.smallcomp.cliqueMax = 5
enhance.fragment.dropKnowsRatio = 0.1
enhance.unidir.flipRatio = 0.05
enhance.rmat.enabled = true
enhance.rmat.nodes = 100000
enhance.rmat.edgesPerNode = 8
# F4: attribute skew
enhance.zipf.enabled = true
enhance.zipf.attrs = locationIP,browserUsed
enhance.zipf.s = 1.1
# F5: temporal burst
enhance.burst.enabled = true
enhance.burst.recentDays = 30
enhance.burst.ratio = 0.2
enhance.burst.windowMillis = 3600000
enhance.burst.windowCount = 24
enhance.hotcold.split = true
enhance.hotcold.hotRatio = 0.95
enhance.supernodeLikeBurst.enabled = true
# F6: dirty data
enhance.dirty.nullContentRatio = 0.01
enhance.dirty.emptyContentRatio = 0.02
enhance.dirty.selfLoopRatio = 0.01
enhance.dirty.dupEdgeRatio = 0.02
enhance.dirty.danglingLikeRatio = 0.01
enhance.dirty.invalidIpRatio = 0.03
enhance.dirty.outOfRangeDateRatio = 0.005
